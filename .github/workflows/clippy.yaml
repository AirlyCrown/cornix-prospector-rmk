name: clippy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".cargo/**"
      - "src/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "keyboard.toml"
      - "memory.x"
      - "rust-toolchain.toml"
      - "vial.json"
      - ".github/workflows/clippy.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  clippy:
    name: Run clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # p256-cortex-m4-sys (BLE security for nRF) compiles C code for the target
      - name: Install Arm GCC
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
